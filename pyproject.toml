[project]
name = "aitop"
# Single source of truth is aitop.__version__; see [tool.hatch.version] below.
dynamic = ["version"]
description = "AI-centric neofetch meets btop — telemetry and lifecycle management for local AI runtimes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nico Mancinelli" }]
keywords = ["ollama", "lmstudio", "mlx", "vllm", "llm", "tui", "monitoring"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "textual>=0.83",
    "rich>=13.7",
    "pydantic>=2.7",
    "psutil>=5.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "textual-dev>=1.5",
]

[project.scripts]
aitop = "aitop.cli:main"

[project.urls]
Homepage = "https://github.com/NicoMancinelli/aitop"
Repository = "https://github.com/NicoMancinelli/aitop"
Issues = "https://github.com/NicoMancinelli/aitop/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aitop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aitop"]

[tool.hatch.build.targets.sdist]
include = ["src/aitop", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
